<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo tunisie</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"  ></script>
</head>
<body>
    <main>
        <div class="mainCard">
            <div class="cityInput">
                <input list="cityList" id="cityInput" placeholder="Choisir une ville" />
                <datalist id="cityList">
                <option value="Tunis"></option>
                <option value="Mandouba"></option>
                <option value="Ariana"></option>
                <option value="Ben Arous"></option>
                <option value="Nebul"></option>
                <option value="Beja"></option>
                <option value="Kairouan"></option>
                </datalist>
                <button onclick="search()" id="searchBtn"><img src="image/icon/search.svg" alt="research icon"></button>
            </div>
            <div class="icon" >
                <img id="icon" src="image/icon/weather-svgrepo-com.svg" alt="wheather icon">
                <div>
                <h1 id="jour">jour</h1>
                <h2 id="date">date</h1>
                </div>
            </div>
            
            <div class="tempCard">
                <div class="infoTitle">   
                    <img src="image/icon/thermometer.svg" alt="">
                    <span>TEMPERATURE</span>
                </div> 
                <h1 id="TEMPERATURE">30°</h1>
            </div>
            <div class="precipCard">
                <div class="infoTitle">   
                    <img src="image/icon/droplet.svg" alt="">
                    <span>PRECIPITATION</span>
                </div> 
                <h1 id="PRECIPITATION">2.3''</h1>
            </div>
            <div class="humidCard">
                <div class="infoTitle">   
                    <img src="image/icon/humidity.svg" alt="">
                    <span>HUMIDITY</span>
                </div> 
                <h1 id="HUMIDITY">38%</h1>
            </div>
            <div class="visibCard">
                <div class="infoTitle">   
                    <img src="image/icon/eye.svg" alt="">
                    <span>VISIBILITY</span>
                </div> 
                <h1 id="VISIBILITY">6Mi</h1>
            </div>
        </div>
        <div class="hourCard">
            <div class="infoTitle">   
                    <img src="image/icon/clock.svg" alt="">
                    <span>HOURLY FORECAST</span>
            </div>
            <hr> 
        </div>
        <div class="dayCard">
            <div class="infoTitle">   
                    <img src="image/icon/calendar.svg" alt="">
                    <span>DAY FORECAST</span>
            </div>
            <hr> 
            <div>               
            </div>
        </div>
        <div class="uvCard">
            <div class="infoTitle">   
                    <img src="image/icon/UV.svg" alt="">
                    <span>UV INDEX</span>
            </div>
        </div>
        <div class="windCard">
            <div class="infoTitle">   
                    <img src="image/icon/wind.svg" alt="">
                    <span>WIND</span>
            </div>
        </div>
    </main>
    <footer>
        <p>simple meteo</p>   
        <p>creation de Mensi Ahmed</p>  
    </footer>

    
</body>
</html>
